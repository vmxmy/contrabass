# Agent-ready work item list for OpenSpec change: portal-do-config-source-of-truth
#
# This file is the canonical machine-readable expansion of tasks.md. It maps 1:1
# onto Plane work items (epic + sub-issue + blocks relation) and carries enough
# context for an autonomous agent to complete each sub-task without re-deriving
# the design.
#
# Field reference:
#   id                 unique within this file (T-X.Y for tasks, EPIC-X for epics)
#   parent             id of parent epic (tasks only)
#   blocks             ids this work item must complete BEFORE
#   blocked_by         ids that must complete before this work item starts
#   serializes_with    ids that write the same file (cannot run truly parallel)
#   affected_files     paths relative to repo root
#   affected_symbols   functions/classes/exports the task creates or edits
#   spec_refs          openspec capability + requirement title that this task satisfies
#   acceptance         testable bullets the task is "done" when satisfied
#   definition_of_done evidence the agent must produce
#   verification_cmd   shell command(s) to run; must exit 0
#   estimate           XS / S / M / L / XL (XS≈<1h, S≈1–3h, M≈half day, L≈1d, XL≈2d+)
#   priority           urgent / high / medium / low
#   labels             plane labels for filtering
#   agent_hint         freeform note: traps, references, "look at file X first"

project:
  name: portal-do-config-source-of-truth
  change_dir: cloud/src/litellm-portal/openspec/changes/portal-do-config-source-of-truth
  worktree: /Users/xumingyang/github/contrabass-portal-do-sot
  branch: feat/portal-do-config-sot
  base_ref: main
  scale_envelope:
    users_max: 500
    teams_max: 50
    session_ttl: 7d
    magic_link_ttl: 15min
    spend_staleness: 60s
    cutover_window: 30min

labels:
  - { id: infra,        color: "#6B7280", desc: "wrangler, bindings, env, schemas" }
  - { id: durable-obj,  color: "#6366F1", desc: "IndexDO / TeamConfigDO" }
  - { id: auth,         color: "#10B981", desc: "magic-link, session, allow-list, login UI" }
  - { id: sync,         color: "#F59E0B", desc: "queue producer/consumer, DLQ" }
  - { id: cron,         color: "#06B6D4", desc: "spend snapshot scheduler" }
  - { id: bootstrap,    color: "#EC4899", desc: "BOOTSTRAP_ADMIN_EMAILS, one-shot import" }
  - { id: routes,       color: "#8B5CF6", desc: "/api/admin/* refactor" }
  - { id: ui,           color: "#0EA5E9", desc: "React SPA, login page, badges" }
  - { id: tests,        color: "#84CC16", desc: "unit + miniflare + e2e" }
  - { id: cutover,      color: "#EF4444", desc: "deploy + maintenance window + rollback" }
  - { id: cleanup,      color: "#737373", desc: "post-cutover dead-code removal" }

# =============================================================================
# EPICS (one per tasks.md section)
# =============================================================================
epics:
  - id: EPIC-1
    name: "1. Schemas and types"
    description: |
      Land schemas and type bindings so every later module compiles. No
      runtime behavior change in this epic.
    labels: [infra]
    priority: high

  - id: EPIC-2
    name: "2. Durable Objects: IndexDO + TeamConfigDO"
    description: |
      Define and register the DO classes that own all team/user/role/budget
      state plus the singleton index. After this epic, wrangler can deploy
      a build that contains the DO classes; no handler is wired to them yet.
    labels: [durable-obj, infra]
    priority: high

  - id: EPIC-3
    name: "3. Auth: magic-link + session + allow-list"
    description: |
      Replace Cloudflare Access with a Worker-owned email magic-link flow
      and signed session cookies. Gated behind DO_SOT_FLAG until
      cutover.
    labels: [auth]
    priority: high

  - id: EPIC-4
    name: "4. Sync: queue producer + consumer + DLQ"
    description: |
      Land the Cloudflare Queue producer used by admin writes and the
      consumer Worker that materializes DO state into LiteLLM with retries
      and a DLQ.
    labels: [sync, infra]
    priority: high

  - id: EPIC-5
    name: "5. Spend snapshot cron"
    description: |
      Scheduled Worker that walks every team and writes spend:current to
      TeamConfigDO ≤60s after LiteLLM records consumption.
    labels: [cron, sync]
    priority: medium

  - id: EPIC-6
    name: "6. Bootstrap + one-shot LiteLLM import"
    description: |
      Idempotent IndexDO.init() that imports current LiteLLM users/teams
      exactly once, and a BOOTSTRAP_ADMIN_EMAILS path that always lands
      configured emails as admins.
    labels: [bootstrap]
    priority: high

  - id: EPIC-7
    name: "7. Wrangler bindings + secrets"
    description: |
      Consolidated wrangler config: DO bindings, queues producer/consumer,
      DLQ, cron trigger, removed CF Access env vars, new secrets documented.
    labels: [infra]
    priority: high

  - id: EPIC-8
    name: "8. Route refactor (DO-sourced reads, DO-first writes)"
    description: |
      Rewire every /api/admin/* handler in routes.ts to read from DO and
      write DO-first + enqueue. Gated by DO_SOT_FLAG.
    labels: [routes]
    priority: high

  - id: EPIC-9
    name: "9. UI: /login, /logout, sync badges"
    description: |
      Add the login surface, the magic-callback surface, the sync-status
      badge, and the awaiting-team-assignment empty state.
    labels: [ui]
    priority: high

  - id: EPIC-10
    name: "10. Tests"
    description: |
      Unit + miniflare + e2e coverage for every new module and a route
      regression pass over /api/admin/*.
    labels: [tests]
    priority: high

  - id: EPIC-11
    name: "11. Cutover + rollback verification"
    description: |
      Pre-cutover deploy, maintenance-window flip, smoke checklist, CF
      Access policy detach, and a documented rollback drill.
    labels: [cutover]
    priority: urgent

  - id: EPIC-12
    name: "12. Cleanup (follow-up commit)"
    description: |
      Delete dead CF Access code, the role-cache LiteLLM projection, the
      dev-auth test shim, and update portal docs.
    labels: [cleanup]
    priority: low

