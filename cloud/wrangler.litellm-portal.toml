name = "litellm-portal-gz-zhiyun"
main = "src/litellm-portal/index.ts"
compatibility_date = "2026-05-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "zhiyun.ziikoo.com", custom_domain = true }
]

[vars]
LITELLM_PORTAL_ALLOWED_EMAIL_DOMAIN = "gz-zhiyun.com"
LITELLM_PORTAL_ALLOWED_EMAILS = "blueyang@gmail.com,xu@ziikoo.com"
PORTAL_ALLOWED_EMAIL_DOMAINS = "gz-zhiyun.com"
# From address for magic-link emails. Must be on a Cloudflare Email Sending
# verified domain (ziikoo.com is onboarded — see Compute → Email Service).
PORTAL_MAIL_FROM = "noreply@ziikoo.com"
LITELLM_BASE_URL = "https://litellm.ziikoo.com"
LITELLM_PORTAL_COMPANY_NAME = "gz-zhiyun"
LITELLM_PORTAL_DISPLAY_NAME = "智云AI管理平台"

# Cloudflare Email Service Workers binding — outbound transactional mail.
# remote = true is required to reach the real send service (paid Workers plan).
# Sender domain (ziikoo.com) must be onboarded in Compute → Email Service →
# Email Sending. Paid plan removes the recipient whitelist requirement.
[[send_email]]
name = "EMAIL"
remote = true

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitDOSQLite"

# IndexDO + TeamConfigDO — see openspec change portal-do-config-source-of-truth.
[[durable_objects.bindings]]
name = "INDEX_DO"
class_name = "IndexDOSQLite"

[[durable_objects.bindings]]
name = "TEAM_CONFIG_DO"
class_name = "TeamConfigDOSQLite"

[[durable_objects.bindings]]
name = "USAGE_DO"
class_name = "UsageDOSQLite"

[[migrations]]
tag = "v1"
new_classes = ["RateLimitDO"]

[[migrations]]
tag = "v2"
new_classes = ["IndexDO", "TeamConfigDO"]

# Migrate all DO classes from legacy KV-backed storage to SQLite-backed storage
# (GA April 2025). Cloudflare forbids enabling SQLite on an already-deployed
# class name, AND a delete migration is rejected while a binding still references
# the deleted class (error 10061). The supported path: point the bindings at
# fresh *SQLite class names, then in ONE migration tag delete the old KV classes
# (no binding references them anymore) and create the new SQLite classes.
# Production data was intentionally discarded for the original class-name
# migration — IndexDO.init() re-imports teams/users from LiteLLM on the first
# /login after deploy, and BOOTSTRAP_ADMIN_EMAILS re-elevates the bootstrap
# admin. RateLimitDO holds only ephemeral 60s counters. IndexDOSQLite and
# TeamConfigDOSQLite now store long-lived portal state in explicit SQL tables;
# their legacy hidden KV rows can be removed through the admin DO storage
# cleanup endpoint after migration-state checks pass.
# Two-deploy migration. CF validates a delete-class migration against the
# CURRENTLY-LIVE deployment's bindings; combining delete+create in one deploy
# fails with error 10061 because the live worker still binds the old KV class
# names. Step 1 (this tag): only create the new SQLite classes and repoint the
# bindings — the old KV classes become orphaned (no binding) but survive.
# Step 2 (tag v4, a separate later deploy): deleted_classes for the now-orphaned
# old KV classes; by then no live deployment references them, so it succeeds.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDOSQLite", "IndexDOSQLite", "TeamConfigDOSQLite"]

# Step 2: the live deployment (post-step-1) no longer binds the legacy KV
# classes, so deleting them no longer hits error 10061. This permanently
# destroys the orphaned KV DO instances + their data (authorized — the SQLite
# DOs were already repopulated by IndexDO.init() after step 1).
[[migrations]]
tag = "v4"
deleted_classes = ["RateLimitDO", "IndexDO", "TeamConfigDO"]

# Step: add the new SQLite-backed UsageDO (usage data platform L1). New class,
# no rename/delete — additive, safe in a single deploy.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["UsageDOSQLite"]

# ---------------------------------------------------------------------------
# Workers Secret Store (opt-in — requires manual provisioning)
# Run: wrangler secrets-store store create default_secrets_store --remote
# Then add secrets:
#   wrangler secrets-store secret put LITELLM_MASTER_KEY --store-id <store-id> --remote
#   wrangler secrets-store secret put ROLE_INVALIDATION_WEBHOOK_TOKEN --store-id <store-id> --remote
# Uncomment the blocks below after the store is provisioned.
# ---------------------------------------------------------------------------
# [[secrets_store_secrets]]
# binding = "LITELLM_MASTER_KEY"
# store_id = "<your-secrets-store-id>"
# secret_name = "LITELLM_MASTER_KEY"
#
# [[secrets_store_secrets]]
# binding = "ROLE_INVALIDATION_WEBHOOK_TOKEN"
# store_id = "<your-secrets-store-id>"
# secret_name = "ROLE_INVALIDATION_WEBHOOK_TOKEN"


# ---------------------------------------------------------------------------
# DEPLOY RUNBOOK — Queues must be created BEFORE first deploy:
#   npx wrangler queues create litellm-sync
#   npx wrangler queues create litellm-sync-dlq
# Wrangler does NOT auto-create Queue resources; deploying before creation
# causes a binding error and the Worker will fail to start.
# ---------------------------------------------------------------------------
# Cloudflare Queue: litellm-sync — admin writes enqueue here after the DO
# commit. A consumer Worker (T-4.4 / PDCSOT-35) drains and pushes to LiteLLM
# admin endpoints with retries and a DLQ. See openspec change
# portal-do-config-source-of-truth, capability portal-litellm-config-sync.
[[queues.producers]]
binding = "LITELLM_SYNC_QUEUE"
queue = "litellm-sync"

# Dead-letter queue: messages here came from litellm-sync after max_retries
# exhausted, or were written here explicitly by the consumer Worker.
# See openspec change portal-do-config-source-of-truth, capability
# portal-litellm-config-sync.
[[queues.producers]]
binding = "LITELLM_SYNC_DLQ"
queue = "litellm-sync-dlq"

# ---------------------------------------------------------------------------
# DEPLOY RUNBOOK — Consumer settings:
#   max_retries = 5: Wrangler retries failed messages up to 5 times before
#     forwarding to dead_letter_queue = "litellm-sync-dlq".
#   dead_letter_queue: must already exist (created via wrangler queues create
#     litellm-sync-dlq above) before this consumer is deployed.
# ---------------------------------------------------------------------------
[[queues.consumers]]
queue = "litellm-sync"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "litellm-sync-dlq"

# Spend snapshot mirror — pulls LiteLLM /team/info into TeamConfigDO every minute.
# See openspec change portal-do-config-source-of-truth, capability portal-litellm-config-sync.
# */30 * * * * → usage rollup (KV); 0 * * * * → UsageDO daily-activity refresh; daily 0 9 also prunes UsageDO retention.
[triggers]
crons = ["0 9 * * *", "* * * * *", "*/30 * * * *", "0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0

# TODO: Create datasets in Cloudflare dashboard or via:
#   wrangler analytics-engine create portal-metrics
#   wrangler analytics-engine create portal-audit
[[analytics_engine_datasets]]
binding = "METRICS_AE"
dataset = "portal-metrics"

[[analytics_engine_datasets]]
binding = "AUDIT_AE"
dataset = "portal-audit"

# NOTE: ROLE_CACHE_KV KV namespace has been removed from this binding.
# The physical namespace (id = 8493d26272f84fe1bfa0c5bd6d564ad8) still exists in
# Cloudflare and can be deleted by an operator after confirming no traffic depends on it:
#   wrangler kv namespace delete --namespace-id 8493d26272f84fe1bfa0c5bd6d564ad8
[[kv_namespaces]]
binding = "USER_PREFS_KV"
id = "433b1ca91b414671a8840280951a96a6"
preview_id = "018d861aecd54a61af541a841c9fc0fa"

[[kv_namespaces]]
binding = "USAGE_ROLLUP_KV"
id = "PLACEHOLDER_SET_IN_TASK_10"
