[[env.staging.d1_databases]]
binding = "CONTROL_PLANE_DB"
database_name = "contrabass-control-plane"
database_id = "ee6d3436-9997-4fcf-b241-e5aab094b729"

[[env.staging.durable_objects.bindings]]
name = "TEAM_COORDINATOR"
class_name = "TeamCoordinator"
script_name = "contrabass-api"

[[env.staging.analytics_engine_datasets]]
binding = "TRACKER_POLLER_METRICS"
dataset = "contrabass_tracker_poller_metrics_staging"

[env.staging.triggers]
