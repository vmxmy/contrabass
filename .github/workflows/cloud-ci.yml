name: Cloud CI

on:
  pull_request:
    paths:
      - "cloud/**"
      - "cloud/schemas/**"

jobs:
  cloud:
    name: Build Cloud Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: make cloud-build
      - run: make cloud-deploy-dry
